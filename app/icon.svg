<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="top"><polygon points="100,15 162,51 100,87 38,51"/></clipPath>
    <clipPath id="right"><polygon points="162,51 100,87 100,157 162,121"/></clipPath>
    <clipPath id="left"><polygon points="38,51 100,87 100,157 38,121"/></clipPath>
  </defs>

  <!-- Face fills -->
  <polygon points="100,15 162,51 100,87 38,51"     fill="#ff6600" fill-opacity="0.22"/>
  <polygon points="162,51 100,87 100,157 162,121"  fill="#ff5500" fill-opacity="0.28"/>
  <polygon points="38,51 100,87 100,157 38,121"    fill="#cc4400" fill-opacity="0.20"/>

  <!-- TOP face CPU pattern -->
  <g clip-path="url(#top)" transform="matrix(62,36,-62,36,100,15)" filter="url(#glow)">
    <!-- Bus lines H -->
    <line x1="0" y1="0.43" x2="1" y2="0.43" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.50" x2="1" y2="0.50" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.57" x2="1" y2="0.57" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <!-- Bus lines V -->
    <line x1="0.43" y1="0" x2="0.43" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.50" y1="0" x2="0.50" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.57" y1="0" x2="0.57" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <!-- Blocks -->
    <rect x="0.05" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.05" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <!-- Hotspots -->
    <circle cx="0.215" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.215" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
    <!-- Reg lines -->
    <line x1="0.07" y1="0.14" x2="0.36" y2="0.14" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.18" x2="0.36" y2="0.18" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.25" x2="0.36" y2="0.25" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.29" x2="0.36" y2="0.29" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.14" x2="0.93" y2="0.14" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.18" x2="0.93" y2="0.18" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.25" x2="0.93" y2="0.25" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.29" x2="0.93" y2="0.29" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.71" x2="0.36" y2="0.71" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.75" x2="0.36" y2="0.75" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.07" y1="0.82" x2="0.36" y2="0.82" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.71" x2="0.93" y2="0.71" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.75" x2="0.93" y2="0.75" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
    <line x1="0.64" y1="0.82" x2="0.93" y2="0.82" stroke="#ffaa00" stroke-width="0.008" opacity="0.6"/>
  </g>

  <!-- RIGHT face CPU pattern -->
  <g clip-path="url(#right)" transform="matrix(62,-36,0,70,100,87)" filter="url(#glow)">
    <line x1="0" y1="0.43" x2="1" y2="0.43" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.50" x2="1" y2="0.50" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.57" x2="1" y2="0.57" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.43" y1="0" x2="0.43" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.50" y1="0" x2="0.50" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.57" y1="0" x2="0.57" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <rect x="0.05" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.05" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <circle cx="0.215" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.215" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- LEFT face CPU pattern -->
  <g clip-path="url(#left)" transform="matrix(62,36,0,70,38,51)" filter="url(#glow)">
    <line x1="0" y1="0.43" x2="1" y2="0.43" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.50" x2="1" y2="0.50" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0" y1="0.57" x2="1" y2="0.57" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.43" y1="0" x2="0.43" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.50" y1="0" x2="0.50" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <line x1="0.57" y1="0" x2="0.57" y2="1" stroke="#ffaa00" stroke-width="0.012" opacity="0.8"/>
    <rect x="0.05" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.05" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.05" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <rect x="0.62" y="0.62" width="0.33" height="0.33" fill="#ff6600" fill-opacity="0.30" stroke="#ff6600" stroke-width="0.016"/>
    <circle cx="0.215" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.215" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.215" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
    <circle cx="0.785" cy="0.785" r="0.038" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Glowing wire-frame edges -->
  <g stroke="#ff6600" stroke-width="2" fill="none" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="100,15 162,51 100,87 38,51"/>
    <line x1="100" y1="87"  x2="100" y2="157"/>
    <line x1="162" y1="51"  x2="162" y2="121"/>
    <line x1="38"  y1="51"  x2="38"  y2="121"/>
    <line x1="100" y1="157" x2="162" y2="121"/>
    <line x1="100" y1="157" x2="38"  y2="121"/>
  </g>
</svg>
