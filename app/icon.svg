<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Favicon: the "Fault line" brand mark (UI_UX_SPEC §2 Brand mark). Rendered
    as a standalone document by the browser (no access to app/globals.css
    custom properties), so the brand gradient stops are literal hex here —
    the same three values `--brand`/`--brand-strong`/`--brand-tertiary` hold
    in app/globals.css. `lint:colors` only scans .ts/.tsx/.css, so this is
    the one place those values are duplicated as literals, by necessity.
  -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="3" y1="2" x2="21" y2="22">
      <stop offset="0" stop-color="#ff6600" />
      <stop offset="0.5" stop-color="#ff5f15" />
      <stop offset="1" stop-color="#ff8c42" />
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <path transform="translate(-.25 1.5)" d="M6 3H12.9L9.9 21H6A3 3 0 0 1 3 18V6A3 3 0 0 1 6 3Z" />
    <path transform="translate(.25 -1.5)" d="M14.7 3H18A3 3 0 0 1 21 6V18A3 3 0 0 1 18 21H11.7Z" />
  </g>
</svg>
