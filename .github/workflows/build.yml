name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dimensys
        uses: actions/checkout@v7

      - name: Checkout dms-engine (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.DMS_ENGINE_REPO }}
          ref: ${{ secrets.DMS_ENGINE_REF }}
          token: ${{ secrets.DMS_ENGINE_PAT }}
          path: dms-engine-checkout

      - name: move dms-engine
        run: |
          mv dms-engine-checkout ../dms-engine

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build dms-engine
        run: |
          cd ../dms-engine
          npm ci
          npm run build

      - name: Sync static assets to dimensys
        run: node scripts/sync-engine.js

      - name: Build dms-engine v3
        run: |
          cd ../dms-engine
          npm run build:v3

      - name: Sync v3 engine output to dimensys
        run: node scripts/sync-engine-v3.js

      - name: Install dimensys dependencies
        run: npm ci

      - name: Build dimensys
        run: npm run build
        env:
          SKIP_PREBUILD: true

      # Add your deployment step here
      # - name: Deploy
      #   run: ...
