name: Lint

# The only workflow that runs on its own: every push and every pull request.
# Static checks only (no build, no tests, no deploy); those are started by
# hand from the Actions tab (Test, Deploy Dev).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:boundary
      - run: npm run lint:colors
      - run: npm run lint:contrast
      - run: npx tsc --noEmit
