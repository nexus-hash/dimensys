name: PR commands

# The owner and maintainers run the manual workflows from a PR by commenting:
#   /test     unit tests and the /dev/ui checks, on the PR's current head
#   /deploy   the tests, then (only if they pass) a Vercel preview of the PR
# Anyone else can also be allowed by naming them in the PR_COMMAND_USERS
# repository variable (comma-separated logins). Everyone else's command is
# refused with a 👎 and nothing runs.
#
# GitHub runs comment-triggered workflows from the default branch's copy of
# this file, so a PR can't change the rules for its own commands. The result
# shows as a commit status on the PR's head and a reply comment.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: pr-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/test') || startsWith(github.event.comment.body, '/deploy'))
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      command: ${{ steps.gate.outputs.command }}
      sha: ${{ steps.gate.outputs.sha }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - name: Check who asked and what for
        id: gate
        uses: actions/github-script@v9
        env:
          EXTRA: ${{ vars.PR_COMMAND_USERS }}
        with:
          script: |
            const word = context.payload.comment.body.trim().split(/\s+/)[0];
            const command = { '/test': 'test', '/deploy': 'deploy' }[word];
            if (!command) return core.info(`Not a command: ${word}`);
            const react = (content) =>
              github.rest.reactions.createForIssueComment({ ...context.repo, comment_id: context.payload.comment.id, content });
            const refuse = async (why) => {
              await react('-1');
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `\`${word}\` not run: ${why}` });
              core.setFailed(why);
            };

            const actor = context.payload.comment.user.login;
            const extra = (process.env.EXTRA || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: actor });
            if (!['admin', 'maintain'].includes(perm.role_name) && !extra.includes(actor.toLowerCase())) {
              return refuse(`@${actor} can't run PR commands (owner and maintainers only).`);
            }

            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            if (pr.state !== 'open') return refuse('the PR is closed.');
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (command === 'deploy' && !sameRepo) return refuse('previews are only built for branches in this repository.');

            await react('rocket');
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              state: 'pending',
              context: `pr-command/${command}`,
              description: `Started by @${actor}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.setOutput('command', command);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('branch', pr.head.ref);

  test:
    needs: gate
    if: needs.gate.outputs.command == 'test'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}

  deploy:
    needs: gate
    if: needs.gate.outputs.command == 'deploy'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy-dev.yml
    with:
      target: preview
      ref: ${{ needs.gate.outputs.sha }}
      branch: ${{ needs.gate.outputs.branch }}
      pr: ${{ github.event.issue.number }}
    secrets: inherit

  report:
    needs: [gate, test, deploy]
    if: ${{ !cancelled() && needs.gate.outputs.command != '' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Status and reply on the PR
        uses: actions/github-script@v9
        env:
          COMMAND: ${{ needs.gate.outputs.command }}
          SHA: ${{ needs.gate.outputs.sha }}
          TEST: ${{ needs.test.result }}
          DEPLOY: ${{ needs.deploy.result }}
        with:
          script: |
            const command = process.env.COMMAND;
            const result = command === 'test' ? process.env.TEST : process.env.DEPLOY;
            const ok = result === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.SHA,
              state: ok ? 'success' : 'failure',
              context: `pr-command/${command}`,
              description: ok ? 'Passed' : `Result: ${result}`,
              target_url: run,
            });
            const what = command === 'test' ? 'Tests' : 'Tests and preview deploy';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `${ok ? '✅' : '❌'} \`/${command}\` on ${process.env.SHA.slice(0, 7)}: ${what} ${ok ? 'passed' : result}. [Run](${run})`,
            });
