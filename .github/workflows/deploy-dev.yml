name: Deploy Dev (Vercel)

# Dev/staging pipeline: builds the proprietary dms-engine on GitHub Actions
# (never on Vercel, which cannot access the private engine repo) and deploys
# the prebuilt Next.js output with `vercel deploy --prebuilt`. Vercel's own
# Git integration must stay disabled for this project (see vercel.json).
#
# Deploys ONLY for:
#   - push to `main` (this repo's main, latest engine `main`)          -> --prod
#   - repository_dispatch type `engine-updated` (engine main changed)  -> --prod
#   - workflow_dispatch (manual)                                       -> --prod
#   - pull_request targeting `main`, same-repo only (forks skipped,
#     secrets aren't available to fork PRs)                            -> preview
#
# PRs into any other branch (e.g. task/* -> v3) and pushes to any other
# branch do NOT trigger this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [engine-updated]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  deploy:
    # Guard against PRs targeting a branch other than main (belt-and-suspenders
    # alongside the `pull_request: branches: [main]` filter above), and skip
    # fork PRs since they don't have access to the deploy secrets.
    if: >-
      (github.event_name != 'pull_request' || github.base_ref == 'main') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "prod=false" >> "$GITHUB_OUTPUT"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          else
            echo "prod=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine ref
        id: engine_ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Always the engine's main branch — this workflow intentionally
            # ignores DMS_ENGINE_REF (that secret is used by build.yml for
            # other purposes); the dev site always tracks engine main.
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dimensys
        uses: actions/checkout@v5

      - name: Checkout dms-engine (private)
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.DMS_ENGINE_REPO }}
          ref: ${{ steps.engine_ref.outputs.ref }}
          token: ${{ secrets.DMS_ENGINE_PAT }}
          path: dms-engine-checkout

      - name: Move dms-engine alongside dimensys
        run: mv dms-engine-checkout ../dms-engine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dms-engine
        run: |
          cd ../dms-engine
          npm ci
          npm run build

      - name: Sync engine output to dimensys
        run: node scripts/sync-engine.js

      - name: Build dms-engine v3
        run: |
          cd ../dms-engine
          npm run build:v3

      - name: Sync v3 engine output to dimensys
        run: node scripts/sync-engine-v3.js

      - name: Install dimensys dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        env:
          SKIP_PREBUILD: "true"
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            npx vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel@${{ env.VERCEL_CLI_VERSION }} build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      # --- Guard: refuse to ship proprietary engine source in the output ---
      # The engine's LICENSE header ("This software and its source code are
      # proprietary and confidential ...") only ever appears in
      # dms-engine/LICENSE — it is never emitted into generated pages, static
      # assets, or the shared component templates that sync-engine.js copies
      # into this repo. Its presence in the build output, or any path that
      # references dms-engine/src directly, indicates the private engine
      # source leaked into the deployable artifact.
      - name: Verify no engine source in build output
        run: |
          set -e
          if [ ! -d .vercel/output ]; then
            echo "::error::.vercel/output not found — build step did not produce output"
            exit 1
          fi

          if find .vercel/output -path '*dms-engine/src*' | grep -q .; then
            echo "::error::Found dms-engine/src path(s) inside .vercel/output:"
            find .vercel/output -path '*dms-engine/src*'
            exit 1
          fi

          if grep -rIl "This software and its source code are proprietary and confidential" .vercel/output; then
            echo "::error::Found the dms-engine proprietary license header inside .vercel/output — engine source leaked into the deployable artifact."
            exit 1
          fi

          # sync-engine-v3.js keeps server-only diagram/puzzle data (interview
          # blocks, puzzle secrets) under server-data/, strictly outside
          # public/ and data/engine/. Fail if that
          # split didn't hold: a server-data path anywhere in the deployable
          # output, or an "interview"/"secret" key inside the statically
          # served files, both indicate server-only data leaked into what
          # ships to the browser.
          if find .vercel/output -path '*server-data*' | grep -q .; then
            echo "::error::Found server-data path(s) inside .vercel/output:"
            find .vercel/output -path '*server-data*'
            exit 1
          fi

          if [ -d .vercel/output/static ] && grep -rIl '"interview"' .vercel/output/static; then
            echo "::error::Found an \"interview\" key inside .vercel/output/static — server-only diagram data leaked into the public build."
            exit 1
          fi

          if [ -d .vercel/output/static ] && grep -rIl '"secret"' .vercel/output/static; then
            echo "::error::Found a \"secret\" key inside .vercel/output/static — server-only puzzle data leaked into the public build."
            exit 1
          fi

          echo "OK: no engine source markers found in .vercel/output"

      - name: Deploy to Vercel
        id: deploy
        env:
          SKIP_PREBUILD: "true"
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            url=$(npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  comment-preview-url:
    needs: deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(needs.deploy.outputs.url) }};
            const marker = '<!-- deploy-dev-preview-comment -->';
            const body = `${marker}\n**Vercel preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
