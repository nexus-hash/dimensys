name: Deploy Dev (Vercel)

# Dev/staging pipeline: builds the proprietary dms-engine on GitHub Actions
# (never on Vercel, which cannot access the private engine repo) and deploys
# the prebuilt Next.js output with `vercel deploy --prebuilt`. Vercel's own
# Git integration must stay disabled for this project (see vercel.json).
#
# Manual only, owner and maintainers only:
#   - a `/deploy` comment on a PR (pr-commands.yml): a preview of the PR's head;
#   - Actions → Deploy Dev → Run workflow, on the branch to deploy.
# Targets:
#   - `preview`: built against the engine branch of the same name when one
#     exists (else engine main); the URL is commented on the PR.
#   - `production`: --prod, built against engine main.
# The Test workflow runs first and must pass; nothing is built or deployed
# otherwise.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  workflow_call:
    inputs:
      target:
        type: string
        default: 'preview'
      ref:
        description: 'Commit to deploy'
        type: string
        default: ''
      branch:
        description: 'Branch the commit is on (picks the engine branch)'
        type: string
        default: ''
      pr:
        description: 'PR to comment the preview URL on'
        type: number
        default: 0

concurrency:
  group: deploy-dev-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 60.1.3

jobs:
  # Started from the Actions tab: owner and maintainers only (plus anyone named
  # in the PR_COMMAND_USERS repository variable). From a PR comment, the PR
  # commands workflow checks this before calling in, so it's skipped here.
  authorize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Owner and maintainers only
        uses: actions/github-script@v9
        env:
          EXTRA: ${{ vars.PR_COMMAND_USERS }}
        with:
          script: |
            const extra = (process.env.EXTRA || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.actor });
            if (!['admin', 'maintain'].includes(data.role_name) && !extra.includes(context.actor.toLowerCase())) {
              core.setFailed(`${context.actor} (${data.role_name}) can't run this: owner and maintainers only.`);
            }

  tests:
    needs: authorize
    if: ${{ !cancelled() && needs.authorize.result != 'failure' }}
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "prod=false" >> "$GITHUB_OUTPUT"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine ref
        id: engine_ref
        env:
          # Passed via env, not interpolated inline into the script: a branch
          # name is user-controlled input (script-injection safety).
          BRANCH: ${{ inputs.branch || github.ref_name }}
          DMS_ENGINE_REPO: ${{ secrets.DMS_ENGINE_REPO }}
          DMS_ENGINE_PAT: ${{ secrets.DMS_ENGINE_PAT }}
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            # Production always tracks engine main.
            echo "ref=main" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads "https://x-access-token:${DMS_ENGINE_PAT}@github.com/${DMS_ENGINE_REPO}.git" "$BRANCH" > /dev/null 2>&1; then
            # A preview of a branch that depends on unmerged engine work builds
            # against the engine branch of the same name.
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dimensys
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout dms-engine (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.DMS_ENGINE_REPO }}
          ref: ${{ steps.engine_ref.outputs.ref }}
          token: ${{ secrets.DMS_ENGINE_PAT }}
          path: dms-engine-checkout

      - name: Move dms-engine alongside dimensys
        run: mv dms-engine-checkout ../dms-engine

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build dms-engine v3
        run: |
          cd ../dms-engine
          npm ci
          npm run build:v3

      - name: Sync v3 engine output to dimensys
        run: node scripts/sync-engine-v3.js

      - name: Install dimensys dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        env:
          SKIP_PREBUILD: "true"
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            npx vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel@${{ env.VERCEL_CLI_VERSION }} build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      # --- Guard: refuse to ship proprietary engine source in the output ---
      # The engine's LICENSE header ("This software and its source code are
      # proprietary and confidential ...") only ever appears in
      # dms-engine/LICENSE — it is never emitted into the v3 output that
      # sync-engine-v3.js copies into this repo. Its presence in the build
      # output, or any path that references dms-engine/src directly,
      # indicates the private engine source leaked into the deployable
      # artifact.
      - name: Verify no engine source in build output
        run: |
          set -e
          if [ ! -d .vercel/output ]; then
            echo "::error::.vercel/output not found — build step did not produce output"
            exit 1
          fi

          if find .vercel/output -path '*dms-engine/src*' | grep -q .; then
            echo "::error::Found dms-engine/src path(s) inside .vercel/output:"
            find .vercel/output -path '*dms-engine/src*'
            exit 1
          fi

          if grep -rIl "This software and its source code are proprietary and confidential" .vercel/output; then
            echo "::error::Found the dms-engine proprietary license header inside .vercel/output — engine source leaked into the deployable artifact."
            exit 1
          fi

          # sync-engine-v3.js keeps server-only diagram/puzzle data (interview
          # blocks, puzzle secrets) under server-data/, strictly outside
          # public/ and data/engine/. Fail if that
          # split didn't hold: a server-data path anywhere in the deployable
          # output, or an "interview"/"secret" key inside the statically
          # served files, both indicate server-only data leaked into what
          # ships to the browser. Only the JSON key form ("interview": …)
          # counts: the bare word is also a player mode name in the bundle.
          if find .vercel/output -path '*server-data*' | grep -q .; then
            echo "::error::Found server-data path(s) inside .vercel/output:"
            find .vercel/output -path '*server-data*'
            exit 1
          fi

          # The engine build's *.compiled.json files (full compiled documents,
          # server-only) must never end up anywhere in the deployable output
          # either, regardless of directory — same leak, different filename.
          if find .vercel/output -name '*.compiled.json' | grep -q .; then
            echo "::error::Found *.compiled.json file(s) inside .vercel/output:"
            find .vercel/output -name '*.compiled.json'
            exit 1
          fi

          if [ -d .vercel/output/static ] && grep -rIlE '"interview"[[:space:]]*:' .vercel/output/static; then
            echo "::error::Found an \"interview\" key inside .vercel/output/static — server-only diagram data leaked into the public build."
            exit 1
          fi

          if [ -d .vercel/output/static ] && grep -rIlE '"secret"[[:space:]]*:' .vercel/output/static; then
            echo "::error::Found a \"secret\" key inside .vercel/output/static — server-only puzzle data leaked into the public build."
            exit 1
          fi

          echo "OK: no engine source markers found in .vercel/output"

      - name: Deploy to Vercel
        id: deploy
        env:
          SKIP_PREBUILD: "true"
        run: |
          if [ "${{ steps.target.outputs.prod }}" = "true" ]; then
            url=$(npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(npx vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  comment-preview-url:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && inputs.target == 'preview' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = ${{ toJSON(needs.deploy.outputs.url) }};
            const marker = '<!-- deploy-dev-preview-comment -->';
            const body = `${marker}\n**Vercel preview deployed:** ${url}`;

            let issue_number = Number(${{ toJSON(inputs.pr) }}) || 0;
            if (!issue_number) {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              });
              if (prs.length === 0) {
                core.info(`No open PR for this branch; preview: ${url}`);
                return;
              }
              issue_number = prs[0].number;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
